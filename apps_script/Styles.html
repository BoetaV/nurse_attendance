<style>
  :root { --green:#0B6B3A; --green2:#0E8048; --yellow:#F2B705; --light:#E8F3EC; --fill:#FFFDF2; --grey:#5f6b66; --line:#cfd8d3; --bad:#F8D7DA; --warn:#FDEFC3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, Helvetica, sans-serif; color:#1d2622; background:#f3f6f4; font-size:13px; }
  .page { max-width:1320px; margin:18px auto; background:#fff; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.08); overflow:hidden; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 24px; border-bottom:5px solid var(--green); }
  header img.logo { height:54px; }
  header .ttl { text-align:right; }
  header h1 { margin:0; font-size:19px; color:var(--green); }
  header p { margin:4px 0 0; color:var(--grey); font-size:12px; }
  .band { height:4px; background:var(--yellow); }
  nav { display:flex; flex-wrap:wrap; gap:4px; padding:10px 24px 0; border-bottom:1px solid var(--line); align-items:flex-end; }
  nav button { background:#fff; color:var(--green); border:1px solid var(--line); border-bottom:0; border-radius:6px 6px 0 0; padding:8px 16px; }
  nav button.on { background:var(--green); color:#fff; border-color:var(--green); }
  nav .sp { flex:1; }
  nav .me { color:var(--grey); font-size:12px; padding:0 8px 8px; }
  section { padding:14px 24px; }
  h2 { color:var(--green); font-size:15px; margin:8px 0 10px; border-bottom:2px solid var(--yellow); padding-bottom:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px 14px; background:var(--light); border-radius:6px; padding:12px; }
  .grid label, .field label { display:block; font-weight:bold; color:var(--green); font-size:11px; text-transform:uppercase; margin-bottom:3px; }
  .grid .ro { padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:#fff; min-height:29px; }
  input, select, textarea { font-family:inherit; font-size:13px; }
  .grid input, .grid select, .field input, .field select { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:var(--fill); }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; align-items:center; }
  button { background:var(--green); color:#fff; border:0; border-radius:4px; padding:7px 13px; font-size:13px; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button.alt { background:#fff; color:var(--green); border:1px solid var(--green); }
  button.warn { background:#fff; color:#a12a2a; border:1px solid #a12a2a; }
  button.sign { background:var(--yellow); color:#1d2622; font-weight:bold; }
  button.sm { padding:3px 8px; font-size:12px; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  th, td { border:1px solid var(--line); padding:3px 5px; text-align:center; }
  thead th { background:var(--green); color:#fff; font-size:11px; }
  thead tr.sub th { background:var(--light); color:var(--green); }
  td.l, th.l { text-align:left; }
  td.cat { text-align:left; min-width:150px; font-weight:bold; }
  td input.n { width:36px; padding:4px 2px; text-align:center; border:1px solid #d9e2dd; border-radius:3px; }
  td input.n.a { background:#fbfdf9; }
  td input.n.over { background:var(--bad); border-color:#c0392b; }
  td input.n.empty { background:#fff7e0; }
  td input.n:disabled { background:transparent; border-color:transparent; color:#1d2622; }
  td.tot { background:var(--light); font-weight:bold; min-width:48px; }
  tr.dt td { background:#f6f9f7; font-weight:bold; }
  tr.dt.area td { background:#d6eadd; }
  .unitpick .agrp { margin:4px 0 6px; padding-bottom:4px; border-bottom:1px dashed var(--line); }
  .unitpick .agrp > label { font-weight:bold; color:var(--green); }
  .unitpick .agrp .us { padding-left:20px; columns:2; }
  tr.miss td { color:#a12a2a; }
  .hi { background:var(--bad) !important; } .mid { background:var(--warn) !important; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .kpi { border:1px solid var(--line); border-left:5px solid var(--green); border-radius:6px; padding:10px 14px; }
  .kpi .v { font-size:24px; font-weight:bold; color:var(--green); }
  .kpi .l { color:var(--grey); font-size:11px; text-transform:uppercase; }
  .kpi.hi .v { color:#a12a2a; }
  table.abs td input, table.abs td select { width:100%; padding:4px; border:1px solid var(--line); border-radius:3px; }
  textarea { width:100%; min-height:70px; border:1px solid var(--line); border-radius:4px; padding:8px; background:var(--fill); }
  textarea:disabled, table.abs input:disabled, table.abs select:disabled { background:#fff; color:#1d2622; }
  .checks { list-style:none; padding:0; margin:0; }
  .checks li { padding:6px 10px; border-radius:4px; margin-bottom:4px; white-space:pre-line; }
  .checks li.ok { background:var(--light); color:var(--green); }
  .checks li.err { background:var(--bad); color:#7a1f1f; }
  .checks li.wrn { background:var(--warn); color:#6b4f00; }
  .sign { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .sign > div { border:1px solid var(--line); border-radius:6px; padding:10px; min-height:96px; }
  .sign label { font-size:11px; font-weight:bold; color:var(--green); text-transform:uppercase; display:block; margin-bottom:6px; }
  .sign .who { font-weight:bold; font-size:14px; }
  .sign .when { color:var(--grey); font-size:12px; margin-top:2px; }
  .sign .pending { color:var(--grey); font-style:italic; }
  .rules { color:var(--grey); font-size:12px; font-style:italic; margin:6px 0 0; }
  .pill { display:inline-block; padding:2px 9px; border-radius:10px; font-size:11px; font-weight:bold; background:#eee; color:#333; }
  .pill.Draft { background:#e9ecef; color:#444; }
  .pill.Completed { background:#dbe9ff; color:#1d4ea0; }
  .pill.Checked { background:var(--warn); color:#6b4f00; }
  .pill.Approved { background:var(--light); color:var(--green); }
  .pill.late { background:var(--bad); color:#7a1f1f; }
  .note { background:var(--warn); border-left:5px solid var(--yellow); padding:10px 14px; border-radius:4px; margin-bottom:8px; }
  .note.info { background:var(--light); border-left-color:var(--green); }
  footer { display:flex; justify-content:space-between; padding:10px 24px; border-top:4px solid var(--yellow); color:var(--grey); font-size:11px; font-style:italic; }
  .hidden { display:none !important; }
  .card { max-width:380px; margin:40px auto; border:1px solid var(--line); border-radius:8px; padding:22px 24px; }
  .card h2 { margin-top:0; }
  .card .field { margin-bottom:12px; }
  .card button { width:100%; padding:10px; }
  .err { color:#a12a2a; font-weight:bold; min-height:18px; white-space:pre-line; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .muted { color:var(--grey); }
  .unitpick { max-height:160px; overflow:auto; border:1px solid var(--line); border-radius:4px; padding:6px; background:#fff; }
  .unitpick label { display:block; text-transform:none; font-weight:normal; color:#1d2622; font-size:13px; }
  #busy { position:fixed; inset:0; background:rgba(255,255,255,.55); display:flex; align-items:center; justify-content:center; z-index:50; }
  #busy div { background:var(--green); color:#fff; padding:12px 22px; border-radius:6px; font-weight:bold; box-shadow:0 2px 10px rgba(0,0,0,.2); }
  #toast { position:fixed; right:20px; bottom:20px; max-width:460px; padding:12px 16px; border-radius:6px; color:#fff; background:var(--green); box-shadow:0 2px 10px rgba(0,0,0,.25); z-index:60; white-space:pre-line; }
  #toast.bad { background:#a12a2a; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:55; }
  .modal > div { background:#fff; border-radius:8px; padding:20px 24px; width:min(520px, 92vw); }
  .modal h3 { margin:0 0 10px; color:var(--green); }
  .secret { font-family:Consolas, monospace; font-size:20px; background:var(--light); padding:8px 12px; border-radius:4px; display:inline-block; letter-spacing:1px; user-select:all; }
  @media (max-width:800px) { .kpis, .sign, .cols { grid-template-columns:1fr 1fr; } header { flex-direction:column; } header .ttl { text-align:center; } }
  @media print {
    body { background:#fff; font-size:10px; } .page { box-shadow:none; margin:0; max-width:none; border-radius:0; }
    .toolbar, nav, .noprint, button { display:none !important; }
    input, select, textarea { border:0 !important; background:transparent !important; appearance:none; -webkit-appearance:none; }
    td input.n { width:24px; font-size:10px; } .kpi .v { font-size:16px; }
    table, .kpis, .sign { break-inside:avoid; } @page { size:A4 landscape; margin:8mm; }
  }
</style>
